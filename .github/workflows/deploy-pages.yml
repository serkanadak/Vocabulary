name: Web sürümlerini GitHub Pages'e yayınla

# Mevcut yayınlanmış siteyi (gh-pages dalı: Kelime Haritası + İbadetlerim +
# LGS Planlayıcı) OLDUĞU GİBİ temel alır ve üstüne Gezgin Günlüğü'nü ekler.
# Böylece eski uygulamalar birebir korunur (yeniden derlenmez), yalnızca
# Gezgin Günlüğü kaynaktan derlenip /gezgin-gunlugu/ altına yerleştirilir.
#   /                 -> Kelime Haritası
#   /ibadet-takip/    -> İbadetlerim
#   /lgs-planlayici/  -> LGS Planlayıcı
#   /gezgin-gunlugu/  -> Gezgin Günlüğü

on:
  push:
    branches: [claude/turkish-vocab-flashcard-3xwegv] # reponun varsayılan dalı
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_OFFLINE: '1'
      CI: '1'
    steps:
      # Varsayılan dal: workflow + Gezgin Günlüğü kaynağı
      - uses: actions/checkout@v4

      # Mevcut yayınlanmış site (gh-pages) — temel alınacak
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _pages_base

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/configure-pages@v5

      # Mevcut siteyi _site'e kopyala (git meta verisi hariç)
      - run: |
          rm -rf _pages_base/.git
          mkdir -p _site
          cp -r _pages_base/. _site/

      # Gezgin Günlüğü'nü kaynaktan derle ve /gezgin-gunlugu altına yerleştir
      - name: Gezgin Günlüğü (web export)
        working-directory: gezgin-gunlugu
        run: |
          npm install --no-audit --no-fund
          npx expo export --platform web --output-dir dist
      - run: |
          rm -rf _site/gezgin-gunlugu
          mkdir -p _site/gezgin-gunlugu
          cp -r gezgin-gunlugu/dist/. _site/gezgin-gunlugu/

      # İbadetlerim'i kaynaktan derle ve /ibadet-takip altına yerleştir.
      # Derleme BAŞARISIZ olursa mevcut yayın (gh-pages'ten kopyalanan hâli)
      # olduğu gibi kalsın: veri/uygulama kaybı olmasın diye çıktı ancak
      # başarılı derlemede kopyalanır.
      - name: İbadetlerim (web export)
        working-directory: ibadet-takip
        run: |
          npm install --no-audit --no-fund
          npx expo export --platform web --output-dir dist
      - run: |
          if [ -f ibadet-takip/dist/index.html ]; then
            rm -rf _site/ibadet-takip
            mkdir -p _site/ibadet-takip
            cp -r ibadet-takip/dist/. _site/ibadet-takip/
          else
            echo "İbadetlerim derlemesi bulunamadı; mevcut yayın korunuyor."
          fi

      - run: touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
